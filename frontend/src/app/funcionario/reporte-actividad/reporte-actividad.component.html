@if (cargando()) {
  <div class="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else if (tarea(); as ta) {
  <mat-toolbar class="topbar-interno" color="primary">
    <button
      mat-icon-button
      type="button"
      aria-label="Volver a bandeja"
      (click)="volverBandeja()"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="topbar-interno__title">{{ tituloToolbar() }}</span>
    @if (soloLectura()) {
      <mat-chip class="toolbar-badge toolbar-badge--completada" selected>Completada</mat-chip>
    }
    <span class="topbar-spacer"></span>
  </mat-toolbar>

  <div class="layout">
    <mat-card class="panel panel--form" appearance="outlined">
      <mat-tab-group class="reporte-tabs" animationDuration="0ms">
        <mat-tab label="Mi informe">
          <app-mi-informe
            [tarea]="tarea()"
            [informe]="informe()"
            [form]="form"
            [modo]="modo()"
            [grabando]="grabando()"
            [lineaVoz]="lineaVoz()"
            [speechDisponible]="speechDisponible()"
            [enviando]="enviando()"
            [soloLectura]="soloLectura()"
            [camposFormularioOrdenados]="camposFormularioOrdenados()"
            [usarFormularioDinamico]="usarFormularioDinamico()"
            [vistaCamposDinamicos]="vistaCamposDinamicos()"
            [permisoNodoActual]="permisoNodoActual()"
            (completar)="completarYEnviar()"
            (guardarBorrador)="guardarBorrador()"
            (setModo)="setModo($event)"
            (toggleMic)="toggleMic()"
            (limpiarVoz)="limpiarVoz()"
          />
        </mat-tab>
        @if (docColabHabilitado()) {
          <mat-tab label="Documento colaborativo">
            <app-documento-colaborativo
              [docColab]="docColab()"
              [docColabCargando]="docColabCargando()"
              [docColabCreando]="docColabCreando()"
              [soloLectura]="soloLectura()"
              [tituloDocColaborativo]="tituloDocColaborativo()"
              (crear)="crearDocumentoColaborativo()"
            />
          </mat-tab>
        }
      </mat-tab-group>
    </mat-card>

    <app-detalle-tarea [tarea]="ta" />
  </div>
}
