<h2 mat-dialog-title>Seleccioná la rama a seguir</h2>

<div mat-dialog-content class="dialog-body">
  <div class="rule" aria-hidden="true"></div>
  <p class="condicion">
    <span class="condicion__k">Condición:</span>
    {{ data.condicion || '—' }}
  </p>
  <div class="acciones">
    @for (op of data.opciones; track op.etiqueta) {
      <button
        mat-raised-button
        color="primary"
        type="button"
        [matTooltip]="op.descripcion ?? ''"
        [matTooltipDisabled]="!op.descripcion"
        (click)="elegir(op.etiqueta)"
      >
        {{ op.etiqueta }}
      </button>
    }
  </div>
</div>
