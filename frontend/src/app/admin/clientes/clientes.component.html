<mat-toolbar class="toolbar" color="primary">
  <div class="toolbar__title">Clientes</div>
  <span class="spacer"></span>

  <mat-form-field class="toolbar__search" appearance="outline">
    <mat-label>Buscar</mat-label>
    <input matInput [formControl]="search" placeholder="Nombre o teléfono" />
    @if (search.value) {
      <button
        mat-icon-button
        matSuffix
        type="button"
        aria-label="Limpiar búsqueda"
        (click)="limpiarBusqueda()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
</mat-toolbar>

<div class="table-card">
  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" class="table">
      <ng-container matColumnDef="nombreCompleto">
        <th mat-header-cell *matHeaderCellDef>Nombre completo</th>
        <td mat-cell *matCellDef="let row">{{ row.nombreCompleto }}</td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let row">{{ row.telefono }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="creadoEn">
        <th mat-header-cell *matHeaderCellDef>Fecha de registro</th>
        <td mat-cell *matCellDef="let row">
          {{ row.creadoEn | date: 'short' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip
            class="chip chip-estado"
            [class.chip-estado--on]="row.activo"
            [class.chip-estado--off]="!row.activo"
            selected
          >
            {{ row.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
</div>
