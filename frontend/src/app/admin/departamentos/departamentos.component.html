<mat-toolbar class="toolbar" color="primary">
  <div class="toolbar__title">Departamentos</div>
  <button mat-raised-button color="accent" type="button" (click)="nuevoDepartamento()">
    <mat-icon>add</mat-icon>
    + Nuevo Departamento
  </button>
  <span class="spacer"></span>

  <mat-form-field class="toolbar__search" appearance="outline">
    <mat-label>Buscar</mat-label>
    <input matInput [formControl]="search" placeholder="Nombre del departamento" />
    @if (search.value) {
      <button
        mat-icon-button
        matSuffix
        type="button"
        aria-label="Limpiar búsqueda"
        (click)="limpiarBusqueda()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
</mat-toolbar>

<div class="table-card">
  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" class="table">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Departamento</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="funcionarios">
        <th mat-header-cell *matHeaderCellDef>Funcionarios</th>
        <td mat-cell *matCellDef="let row" class="col-funcionarios">
          <span class="func-count" aria-hidden="true">{{ row.cantidadFuncionarios }}</span>
          <button
            mat-stroked-button
            color="primary"
            type="button"
            class="btn-ver-func"
            aria-label="Ver funcionarios del departamento"
            (click)="verFuncionarios(row)"
          >
            <mat-icon>group</mat-icon>
            Ver funcionarios
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip
            class="chip chip-estado"
            [class.chip-estado--on]="row.activo"
            [class.chip-estado--off]="!row.activo"
            selected
          >
            {{ row.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
        <td mat-cell *matCellDef="let row" class="col-acciones">
          <button
            mat-icon-button
            type="button"
            color="primary"
            aria-label="Editar"
            (click)="editar(row)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            color="primary"
            [attr.aria-label]="row.activo ? 'Desactivar' : 'Activar'"
            (click)="activarDesactivar(row)"
          >
            <mat-icon>{{ row.activo ? 'toggle_on' : 'toggle_off' }}</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            color="warn"
            aria-label="Eliminar"
            (click)="eliminar(row)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons
    aria-label="Seleccionar página de departamentos"
  ></mat-paginator>
</div>
