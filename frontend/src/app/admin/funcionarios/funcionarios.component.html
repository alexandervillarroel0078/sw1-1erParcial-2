<mat-toolbar class="toolbar" color="primary">
  <div class="toolbar__title">Funcionarios</div>
  <span class="spacer"></span>

  <mat-form-field class="toolbar__search" appearance="outline">
    <mat-label>Buscar</mat-label>
    <input matInput [formControl]="search" placeholder="Nombre o correo" />
    @if (search.value) {
      <button
        mat-icon-button
        matSuffix
        type="button"
        aria-label="Limpiar búsqueda"
        (click)="limpiarBusqueda()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <button mat-raised-button color="accent" type="button" (click)="nuevoFuncionario()">
    <mat-icon>person_add</mat-icon>
    Nuevo Funcionario
  </button>
</mat-toolbar>

<div class="table-card">
  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" class="table">
      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef class="col-avatar"></th>
        <td mat-cell *matCellDef="let row" class="col-avatar">
          <div class="avatar" aria-hidden="true">{{ iniciales(row.nombre) }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre completo</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef>Correo electrónico</th>
        <td mat-cell *matCellDef="let row">{{ row.correo }}</td>
      </ng-container>

      <ng-container matColumnDef="departamento">
        <th mat-header-cell *matHeaderCellDef>Departamento</th>
        <td mat-cell *matCellDef="let row">{{ row.departamentoNombre }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip
            class="chip chip-rol"
            [class.chip-rol--admin]="row.rol === 'ADMINISTRADOR'"
            [class.chip-rol--func]="row.rol === 'FUNCIONARIO'"
            selected
          >
            {{ rolEtiqueta(row.rol) }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip
            class="chip chip-estado"
            [class.chip-estado--on]="row.activo"
            [class.chip-estado--off]="!row.activo"
            selected
          >
            {{ row.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
        <td mat-cell *matCellDef="let row" class="col-acciones">
          <button
            mat-icon-button
            type="button"
            color="primary"
            aria-label="Editar"
            (click)="editar(row)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            color="warn"
            aria-label="Eliminar"
            (click)="eliminar(row)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons
    aria-label="Seleccionar página de funcionarios"
  ></mat-paginator>
</div>
