spring:
  application:
    name: backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/dpn_workflow}
  servlet:
    # Límites para POST multipart (p. ej. /api/archivos/upload)
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: dpn-workflow-secret-key-2025
  expiration: 86400000

storage:
  bucket: ${AWS_S3_BUCKET:flowgov-docs}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  region: ${MINIO_REGION:us-east-1}

logging:
  file:
    name: logs/backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.dpn.backend.informe: DEBUG
    root: WARN
